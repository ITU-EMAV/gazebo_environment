# Gazebo <-> ROS 2 topics, all in one ros_gz_bridge process.
# lazy: true subscribes to Gazebo only while a ROS node listens to the topic, so an
# unused sensor costs nothing (Gazebo also skips rendering sensors nobody listens to).

# Simulation clock and robot state (always needed)
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /world/sonoma/model/sac/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /sac/ground_truth/pose
  gz_topic_name: /sac/ground_truth/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

- ros_topic_name: /pose_info
  gz_topic_name: /world/sonoma/pose/info
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  lazy: true

# Driving
- ros_topic_name: /sac/actuators/cmd_vel
  gz_topic_name: /sac/actuators/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /sac/calculations/steering_odom
  gz_topic_name: /sac/calculations/steering_odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  lazy: true

# Front RGB-D camera
- ros_topic_name: /sac/sensors/front_camera/image
  gz_topic_name: /sac/sensors/front_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sac/sensors/front_camera/depth_image
  gz_topic_name: /sac/sensors/front_camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sac/sensors/front_camera/points
  gz_topic_name: /sac/sensors/front_camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sac/sensors/front_camera/camera_info
  gz_topic_name: /sac/sensors/front_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sac/sensors/front_camera/imu
  gz_topic_name: /sac/sensors/front_camera/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  lazy: true

# Other sensors
- ros_topic_name: /sac/sensors/middle_imu/imu
  gz_topic_name: /sac/sensors/middle_imu/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sac/sensors/navsat/navsat
  gz_topic_name: /sac/sensors/navsat/navsat
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sac/sensors/front_3d_lidar/points
  gz_topic_name: /sac/sensors/front_3d_lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
